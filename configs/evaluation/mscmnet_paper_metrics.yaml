paper:
  title: Water demand forecasting in multiple district metered areas based on a multi-scale correction module neural network architecture
  journal: Water Research X
  year: 2024
  article: "100269"
  doi: 10.1016/j.wroa.2024.100269
  source: Supplementary material, sections S1-1 through S1-8
  protocol: common_46
  expected_sequences: 46
  mape_unit: fraction
  metric_conventions:
    dma_rows: metric_per_dma
    total_MAE: sum_of_A_to_J_dma_mae
    total_MAPE_RMSE_NSE: metric_on_hourly_sum_of_A_to_J_demand
  primary_reference_model: MSCMNet_W
  secondary_reference_models:
    - MSCMNet_WM
  entity_order: [A, B, C, D, E, F, G, H, I, J, total]
  metric_order: [MAE, MAPE, RMSE, NSE]

# Values are transcribed from the attached publisher supplementary document.
# In both MAE tables, for all six published models, the displayed total equals
# the sum of DMA A-J (within the table's three-decimal rounding).  The other
# total metrics use the total-demand series convention.
# MSCMNet_W is the primary reference because it has the best total-demand
# result for all four metrics in both the 24 h and 168 h tables.
