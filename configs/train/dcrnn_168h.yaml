# DCRNN baseline: next-168-hour prediction from 672 hours of history.
base_config: configs/model/dcrnn.yaml

source:
  data_dir: data/processed/data_build
  split_config: configs/data/paper_split.yaml
  feature_config: configs/data/features.yaml
  sample_index: data/processed/data_build/sample_index_multi_step_168h.csv

task:
  name: multi_step_168h
  display_name: week-ahead 168-hour forecasting
  horizon: 168
  history_hours: 672
  stride_hours: 24

features:
  weather_columns:
    - rainfall_depth
    - air_temperature
    - air_humidity
    - windspeed
  temporal_encoding: cyclical
  historical_weather: true
  future_weather: false
  future_temporal: true
  expected_input_dim: 12
  expected_future_exog_dim: 7

split:
  expected_development_samples: 680
  validation_samples: 68
  # Six daily origins separate the last fit label from validation labels.
  purge_samples: 6
  expected_fit_samples: 606
  expected_test_candidates: 74
  expected_operational_samples: 74
  expected_strict_samples: 46
  expected_common_samples: 46

training:
  loss: mae
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.00001
  batch_size: 16
  # Validation is inference-only and contains exactly 68 samples.  One batch
  # removes outer DataLoader/decoder launch overhead without changing samples.
  validation_batch_size: 68
  max_epochs: 100
  early_stopping_patience: 15
  early_stopping_min_delta: 0.0
  gradient_clip_norm: 5.0
  shuffle_train_samples: true
  seeds: [0, 1, 2, 3, 4]
  scheduled_sampling:
    schedule: inverse_sigmoid
    cl_decay_steps: 350
  tensorboard:
    enabled: true
    subdir: tensorboard
    flush_every_epochs: 1

runtime:
  device: auto
  allow_cpu_fallback: false
  # A formal run is started only on a lightly occupied visible GPU.
  minimum_free_memory_mib: 8192
  maximum_used_memory_mib: 2048
  maximum_gpu_utilization_percent: 20

evaluation:
  primary_protocol: common_46
  protocols:
    - operational
    - strict_within_test
    - common_46
  metrics: [MAE, MAPE, RMSE, NSE]
  teacher_forcing_ratio: 0.0

output:
  base_dir: results/baselines/dcrnn/168h
  keep_last_checkpoint_after_training: false
