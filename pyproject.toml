[project]
name = "star-gnn-bwdf"
version = "1.2.0"
description = "Reproducible multi-DMA water-demand forecasting with DCRNN, STGCN, and STaR-GNN"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "pyarrow>=12.0",
    "wf4bwdf @ git+https://github.com/WaterFutures/wf4bwdf.git@5da2d47752190dd69bc3ee612dff043a52e25a2b",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
plots = [
    "matplotlib>=3.7",
]
model = [
    "torch>=2.9",
    "tensorboard>=2.16",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
