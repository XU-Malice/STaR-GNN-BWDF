name: source-and-protocol-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,plots,model]"
      - name: Source, protocol and leakage tests
        # GitHub CI does not redistribute BWDF raw/processed data.  The source-only
        # mode skips only four generated-index existence checks; clean-room runs
        # the full suite after rebuilding data from the licensed upstream source.
        run: bash scripts/reproduce/smoke_test.sh --source-only
      - name: Audit public repository boundary
        run: python scripts/reproduce/audit_public_repository.py
